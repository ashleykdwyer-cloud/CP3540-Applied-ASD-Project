<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Task Manager</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    
    <nav class="navbar">
        <span class="nav-title">Task Manager</span>
        <div class="nav-right">
            <span id="navUsername">Admin</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

   
    <div class="main-content">

    
        <div class="page-header">
            <div>
                <h1>User Management</h1>
                <p class="page-subtitle">Create and manage user accounts and roles</p>
            </div>
            <button class="btn-primary" onclick="openCreateModal()">+ Add New User</button>
        </div>

       
        <div class="summary-cards">
            <div class="summary-card">
                <div class="summary-value" id="totalUsers">0</div>
                <div class="summary-label">Total Users</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="totalWorkers">0</div>
                <div class="summary-label">Workers</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="totalSupervisors">0</div>
                <div class="summary-label">Supervisors</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="totalAdmins">0</div>
                <div class="summary-label">Administrators</div>
            </div>
        </div>

       
        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="Search by name or username..."
                   oninput="filterUsers()">
            <select id="roleFilter" onchange="filterUsers()">
                <option value="">All Roles</option>
                <option value="worker">Worker</option>
                <option value="supervisor">Supervisor</option>
                <option value="administrator">Administrator</option>
            </select>
        </div>

       
        <div class="table-wrapper">
            <table class="user-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr>
                        <td colspan="5" class="empty-row">Loading users...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

  
    <div id="createModal" class="modal hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Add New User</h3>
                <button class="close-btn" onclick="closeModal('createModal')">✕</button>
            </div>

            <label>Full Name</label>
            <input type="text" id="createName" placeholder="e.g. John Smith">

            <label>Username</label>
            <input type="text" id="createUsername" placeholder="e.g. john.smith">

            <label>Password</label>
            <input type="password" id="createPassword" placeholder="Enter password">

            <label>Role</label>
            <select id="createRole">
                <option value="worker">Worker</option>
                <option value="supervisor">Supervisor</option>
                <option value="administrator">Administrator</option>
            </select>

            <p id="createError" class="error-msg"></p>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal('createModal')">Cancel</button>
                <button class="btn-submit" onclick="createUser()">Create User</button>
            </div>
        </div>
    </div>

    
    <div id="editModal" class="modal hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Edit User</h3>
                <button class="close-btn" onclick="closeModal('editModal')">✕</button>
            </div>

            <input type="hidden" id="editUserId">

            <label>Full Name</label>
            <input type="text" id="editName" placeholder="Full name">

            <label>Username</label>
            <input type="text" id="editUsername" placeholder="Username">

            <label>Role</label>
            <select id="editRole">
                <option value="worker">Worker</option>
                <option value="supervisor">Supervisor</option>
                <option value="administrator">Administrator</option>
            </select>

            <p id="editError" class="error-msg"></p>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal('editModal')">Cancel</button>
                <button class="btn-submit" onclick="updateUser()">Save Changes</button>
            </div>
        </div>
    </div>

   
    <div id="toast" class="toast hidden"></div>

    <script src="js/admin.js"></script>
</body>
</html>
